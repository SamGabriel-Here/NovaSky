name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The catalogues are committed, so the suite runs entirely offline. Nothing here
      # reaches CelesTrak, SIMBAD or the survey services.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Proves the app bundles on every target platform, including the native
      # better-sqlite3 binding, without spending the time to make installers.
      - name: Build
        run: npm run build

  runtime:
    name: Boot the built app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A renderer that throws while loading leaves a blank window and nothing in the
      # logs, so "does it actually come up" needs its own check. There is no GPU on a
      # CI runner, hence xvfb and software WebGL, and Chromium's SUID sandbox helper is
      # not root-owned in the runner image, hence --no-sandbox. Both are CI-only flags:
      # the app itself is unchanged, and a real build keeps the sandbox.
      - name: Smoke test
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke.cjs
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 1
          NOVASKY_SOFTWARE_GL: 1

      # NovaSky's central promise is that it works with no network at all.
      - name: Offline check
        run: xvfb-run -a npx electron --no-sandbox scripts/offline-check.cjs
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 1
          NOVASKY_SOFTWARE_GL: 1
